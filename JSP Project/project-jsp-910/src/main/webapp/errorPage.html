<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Error Page</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#1E2533;
}

.error-container{
    background:#2F354B;
    padding:40px;
    width:400px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    animation:fadeIn 0.5s ease;
}

.error-code{
    font-size:80px;
    color:#EF4444;
    font-weight:bold;
    margin-bottom:10px;
}

.error-title{
    font-size:28px;
    color:#D6DCE5;
    margin-bottom:15px;
}

.error-message{
    color:#9CA3AF;
    font-size:16px;
    margin-bottom:30px;
    line-height:1.6;
}

.home-btn{
    display:inline-block;
    text-decoration:none;
    background:#4A6072;
    color:white;
    padding:12px 28px;
    border-radius:30px;
    transition:0.3s;
    font-weight:bold;
}

.home-btn:hover{
    background:#6F8598;
    transform:translateY(-3px);
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

</head>
<body>

<div class="error-container">

    <div class="error-code">
        404
    </div>

    <div class="error-title">
        Something Went Wrong
    </div>

    <div class="error-message">
        The page you are looking for does not exist
        or an unexpected error occurred.
    </div>

    <a href="/" class="home-btn">
        Back To Home
    </a>

</div>

</body>
</html>
